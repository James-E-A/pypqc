[project]
name = 'pypqc-cffi-bindings-kyber'
version = '0.9.161721'
dependencies = [
    'cffi >= 1.0.0 ; platform_python_implementation != "PyPy"',
]
classifiers = [
    'Intended Audience :: Developers',
    'License :: Free To Use But Restricted',
    'Topic :: Security :: Cryptography',
    'Topic :: Software Development :: Libraries',
]
license = {file = "LICENSE-Kyber.rst"}
readme = {file = "LICENSE-Kyber.rst", content-type = "text/x-rst"}

[build-system]
requires = [
    'cffi >= 1.14.5',
    # setuptools 70 and higher breaks any version of cffi prior to 1.17.1
    'setuptools >= 49.5.0 , < 70',
    'wheel >= 0.30.0',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
